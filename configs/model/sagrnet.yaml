defaults:
  - model

graph_data:
  graph_cache_dir: "./tmp"

graph_model_configurations:
  use_prediction_node_label_propagation: True
  prediction_node_label_propagation_args:
    iters: 2
    alpha: 0.5
    conf_thresh: 0.7
  felzenszwalb:
    felz_scale: 100
    felz_sigma: 0.4
    felz_min_size: 30

model_name: SAGRNet
encoder_name: sage_gat18