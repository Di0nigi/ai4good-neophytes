defaults:
  - model

graph_data:
  graph_cache_dir: "./tmp"

graph_config:
  use_phenology: True
  use_prediction_node_label_propagation: True
  prediction_node_label_propagation_args:
    iters: 2
    alpha: 0.5
    conf_thresh: 0.7
  felzenszwalb:
    felz_scale: 100
    felz_sigma: 0.4
    felz_min_size: 30
  graph_kdtree_radius: 60

plot_predictions: False
plot_num_tiles: 4
plot_max_size: 1024

model_name: SAGRNet
encoder_name: sage_gat18